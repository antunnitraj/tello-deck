name: Flatpak

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  flatpak:
    permissions:
      contents: read
    name: Flatpak Build
    runs-on: ubuntu-latest
    container:
      image: bilelmoussaoui/flatpak-github-actions:gnome-46
      options: --privileged
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: tello-deck.flatpak
          manifest-path: com.github.antunnitraj.tello-deck.json
          cache-key: flatpak-builder-${{ github.sha }}
