<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="#1a73e8"/>

  <!-- Drone body (central square) -->
  <rect x="48" y="48" width="32" height="32" rx="6" ry="6" fill="#ffffff"/>

  <!-- Arms -->
  <line x1="48" y1="48" x2="24" y2="24" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
  <line x1="80" y1="48" x2="104" y2="24" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
  <line x1="48" y1="80" x2="24" y2="104" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
  <line x1="80" y1="80" x2="104" y2="104" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>

  <!-- Propellers -->
  <ellipse cx="24" cy="24" rx="14" ry="5" fill="#ffffff" opacity="0.85" transform="rotate(-45 24 24)"/>
  <ellipse cx="104" cy="24" rx="14" ry="5" fill="#ffffff" opacity="0.85" transform="rotate(45 104 24)"/>
  <ellipse cx="24" cy="104" rx="14" ry="5" fill="#ffffff" opacity="0.85" transform="rotate(45 24 104)"/>
  <ellipse cx="104" cy="104" rx="14" ry="5" fill="#ffffff" opacity="0.85" transform="rotate(-45 104 104)"/>

  <!-- Camera lens -->
  <circle cx="64" cy="64" r="8" fill="#1a73e8"/>
  <circle cx="64" cy="64" r="5" fill="#0d47a1"/>
</svg>
